{% extends "base.html" %}
{% block title %}Log in / Sign up · MoodTune{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-tabs">
        <button type="button" class="tab-btn active" data-tab="login">Log in</button>
        <button type="button" class="tab-btn" data-tab="signup">Sign up</button>
    </div>

    <form id="login-form" class="auth-form">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log in</button>
    </form>

    <form id="signup-form" class="auth-form hidden">
        <input type="text" name="name" placeholder="Nickname" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password (min. 6 characters)" required minlength="6">
        <button type="submit">Sign up</button>
    </form>

    <p id="auth-status" class="status"></p>
</div>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
